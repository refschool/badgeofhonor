    container_name: backend
    image: node:22
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "5001:5001"
    volumes:
      - ./:/app:z
    stdin_open: true
    tty: true

